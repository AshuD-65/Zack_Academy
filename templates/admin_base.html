{% extends 'base.html' %}

{% block content %}
<div class="flex min-h-[calc(100vh-4rem)] bg-gray-50">
    <!-- Modern Sidebar with Gradient Background -->
    <aside class="w-72 flex-shrink-0 bg-gradient-to-b from-indigo-600 via-indigo-700 to-indigo-900 text-white shadow-2xl">
        <!-- Sidebar Header -->
        <div class="p-6 border-b border-indigo-500/30">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-lg bg-white/10 backdrop-blur-sm flex items-center justify-center">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                    </svg>
                </div>
                <div>
                    <p class="text-xs font-medium text-indigo-200 uppercase tracking-wider">Control Center</p>
                    <h2 class="text-lg font-bold text-white">Admin Panel</h2>
                </div>
            </div>
        </div>

        <!-- Navigation Menu -->
        <nav class="p-4 space-y-2">
            <!-- Dashboard -->
            <a href="{% url 'admin_dashboard' %}" class="nav-link group flex items-center space-x-3 rounded-xl px-4 py-3 text-sm font-medium text-white/90 transition-all duration-200 hover:bg-white/10 hover:text-white hover:shadow-lg hover:scale-105 active:scale-95" data-page="dashboard">
                <svg class="w-5 h-5 text-indigo-300 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                </svg>
                <span>Dashboard</span>
            </a>

            <!-- Students -->
            <a href="{% url 'admin_all_students' %}" class="nav-link group flex items-center space-x-3 rounded-xl px-4 py-3 text-sm font-medium text-white/90 transition-all duration-200 hover:bg-white/10 hover:text-white hover:shadow-lg hover:scale-105 active:scale-95" data-page="students">
                <svg class="w-5 h-5 text-indigo-300 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
                <span>Students</span>
            </a>

            <!-- Teachers -->
            <a href="{% url 'admin_all_teachers' %}" class="nav-link group flex items-center space-x-3 rounded-xl px-4 py-3 text-sm font-medium text-white/90 transition-all duration-200 hover:bg-white/10 hover:text-white hover:shadow-lg hover:scale-105 active:scale-95" data-page="teachers">
                <svg class="w-5 h-5 text-indigo-300 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                </svg>
                <span>Teachers</span>
            </a>

            <!-- Courses -->
            <a href="{% url 'admin_all_courses' %}" class="nav-link group flex items-center space-x-3 rounded-xl px-4 py-3 text-sm font-medium text-white/90 transition-all duration-200 hover:bg-white/10 hover:text-white hover:shadow-lg hover:scale-105 active:scale-95" data-page="courses">
                <svg class="w-5 h-5 text-indigo-300 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                </svg>
                <span>Courses</span>
            </a>

            <!-- Divider -->
            <div class="py-2">
                <div class="h-px bg-white/20"></div>
            </div>

            <!-- All Users -->
            <a href="{% url 'admin_all_users' %}" class="nav-link group flex items-center space-x-3 rounded-xl px-4 py-3 text-sm font-medium text-white/90 transition-all duration-200 hover:bg-white/10 hover:text-white hover:shadow-lg hover:scale-105 active:scale-95" data-page="users">
                <svg class="w-5 h-5 text-indigo-300 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
                <span>All Users</span>
            </a>

            <!-- Staff IDs -->
            <a href="{% url 'admin_staff_ids' %}" class="nav-link group flex items-center space-x-3 rounded-xl px-4 py-3 text-sm font-medium text-white/90 transition-all duration-200 hover:bg-white/10 hover:text-white hover:shadow-lg hover:scale-105 active:scale-95" data-page="staff">
                <svg class="w-5 h-5 text-indigo-300 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
                </svg>
                <span>Staff IDs</span>
            </a>
        </nav>

        <!-- Logout Section -->
        <div class="absolute bottom-0 w-72 p-4 border-t border-indigo-500/30 bg-indigo-900/50 backdrop-blur-sm">
            <a href="{% url 'admin_logout' %}" class="group flex items-center justify-center space-x-2 rounded-xl px-4 py-3 text-sm font-medium text-white bg-red-500/20 transition-all duration-200 hover:bg-red-500 hover:shadow-lg hover:scale-105 active:scale-95">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
                <span>Logout</span>
            </a>
        </div>
    </aside>

    <!-- Main Content Area with Enhanced Background -->
    <main class="flex-1 overflow-auto bg-gray-50">
        <div class="min-h-full">
            {% block admin_content %}{% endblock %}
        </div>
    </main>
</div>

<style>
/* Add smooth scrollbar styling */
aside::-webkit-scrollbar {
    width: 6px;
}
aside::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.05);
}
aside::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 3px;
}
aside::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.3);
}

/* Active navigation link */
.nav-link.active {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.1));
    color: white;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
    border-left: 4px solid white;
}

.nav-link.active svg {
    color: white;
}

/* Add subtle animation to sidebar */
@keyframes slideIn {
    from {
        transform: translateX(-20px);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

nav .nav-link {
    animation: slideIn 0.3s ease-out forwards;
}

nav .nav-link:nth-child(1) { animation-delay: 0.05s; }
nav .nav-link:nth-child(2) { animation-delay: 0.1s; }
nav .nav-link:nth-child(3) { animation-delay: 0.15s; }
nav .nav-link:nth-child(4) { animation-delay: 0.2s; }
nav .nav-link:nth-child(6) { animation-delay: 0.25s; }
nav .nav-link:nth-child(7) { animation-delay: 0.3s; }
</style>

<script>
// Highlight active navigation link based on current URL
document.addEventListener('DOMContentLoaded', function() {
    const currentPath = window.location.pathname;
    const navLinks = document.querySelectorAll('.nav-link');
    
    navLinks.forEach(link => {
        if (link.getAttribute('href') === currentPath) {
            link.classList.add('active');
        }
        
        // Also check for partial matches (e.g., /admin-dashboard/students/123/edit should highlight Students)
        const linkPath = link.getAttribute('href');
        if (currentPath.startsWith(linkPath) && linkPath !== '{% url "admin_dashboard" %}') {
            link.classList.add('active');
        }
    });
});
</script>
{% endblock %}
